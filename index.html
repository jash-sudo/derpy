<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit Derpy</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}
canvas{
    display:block;
    margin:auto;
    background:linear-gradient(#87ceeb,#cdefff);
}
#info{
    position:absolute;
    top:15px;
    left:15px;
    font-size:22px;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}
</style>
</head>
<body>

<div id="info">
WASD - Move<br>
Click - Attack
</div>

<canvas id="game" width="1200" height="700"></canvas>

<audio id="cry" src="babycry.mp3" preload="auto"></audio>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const cry=document.getElementById("cry");

const derpy=new Image();
derpy.src="derpy.png";

const keys={};

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let player={
    x:200,
    y:550,
    w:40,
    h:70,
    speed:6
};

let sword={
    angle:-0.8,
    swinging:false,
    timer:0
};

let enemy={
    x:850,
    y:420,
    w:220,
    h:220,
    hp:100,
    flash:0
};

let particles=[];

canvas.onclick=()=>{
    if(!sword.swinging){
        sword.swinging=true;
        sword.timer=0;
        sword.angle=-0.8;
    }
};

function hitEnemy(){

    let tipX=player.x+Math.cos(sword.angle)*170;
    let tipY=player.y-35+Math.sin(sword.angle)*170;

    if(
        tipX>enemy.x &&
        tipX<enemy.x+enemy.w &&
        tipY>enemy.y &&
        tipY<enemy.y+enemy.h &&
        enemy.hp>0
    ){

        enemy.hp-=10;
        enemy.flash=6;
        enemy.x+=25;

        cry.currentTime=0;
        cry.play();

        for(let i=0;i<25;i++){
            particles.push({
                x:tipX,
                y:tipY,
                vx:(Math.random()-0.5)*10,
                vy:(Math.random()-0.5)*10,
                life:40
            });
        }
    }
}

function update(){

    if(keys["w"]) player.y-=player.speed;
    if(keys["s"]) player.y+=player.speed;
    if(keys["a"]) player.x-=player.speed;
    if(keys["d"]) player.x+=player.speed;

    player.x=Math.max(20,Math.min(canvas.width-20,player.x));
    player.y=Math.max(100,Math.min(canvas.height-20,player.y));

    if(sword.swinging){

        sword.timer++;
        sword.angle+=0.28;

        if(sword.timer==4)
            hitEnemy();

        if(sword.timer>10){
            sword.swinging=false;
            sword.angle=-0.8;
        }
    }

    if(enemy.flash>0)
        enemy.flash--;

    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.3;
        p.life--;
    });

    particles=particles.filter(p=>p.life>0);
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#45a049";
    ctx.fillRect(0,620,canvas.width,80);

    // player
    ctx.fillStyle="#222";
    ctx.fillRect(player.x-20,player.y-70,40,70);

    ctx.save();

    ctx.translate(player.x,player.y-35);
    ctx.rotate(sword.angle);

    ctx.fillStyle="#bfbfbf";
    ctx.fillRect(0,-5,170,10);

    ctx.fillStyle="#6b3d16";
    ctx.fillRect(-12,-10,16,20);

    ctx.restore();

    // enemy

    if(enemy.hp>0){

        if(enemy.flash)
            ctx.filter="brightness(1.8) hue-rotate(-40deg)";
        else
            ctx.filter="none";

        ctx.drawImage(derpy,enemy.x,enemy.y,enemy.w,enemy.h);

        ctx.filter="none";

        ctx.fillStyle="red";
        ctx.fillRect(enemy.x,enemy.y-22,enemy.w,12);

        ctx.fillStyle="lime";
        ctx.fillRect(enemy.x,enemy.y-22,enemy.w*(enemy.hp/100),12);

    }else{

        ctx.save();
        ctx.translate(enemy.x+110,enemy.y+110);
        ctx.rotate(Math.PI/2);
        ctx.drawImage(derpy,-110,-110,220,220);
        ctx.restore();

        ctx.fillStyle="white";
        ctx.font="70px Arial";
        ctx.fillText("YOU WIN",430,120);

    }

    particles.forEach(p=>{
        ctx.fillStyle="red";
        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fill();
    });

}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

derpy.onload=loop;

</script>

</body>
</html>
