<!doctype html><html><head><meta charset="utf-8"><title>Hit Derpy</title><style>body{margin:0;overflow:hidden;background:#87ceeb}canvas{display:block}#i{position:absolute;left:10px;top:10px;font:20px Arial;color:#fff}</style></head><body><div id=i>WASD move • Click attack</div><canvas id=c width=1000 height=600></canvas><audio id=cry src="babycry.mp3"></audio><script>
const cv=c,ctx=cv.getContext('2d'),img=new Image();img.src='derpy.png';const cry=document.getElementById('cry');
let p={x:120,y:500,s:5},e={x:700,y:360,w:180,h:180,hp:100,f:0},k={},ang=-.8,sw=0,parts=[];
addEventListener('keydown',ev=>k[ev.key.toLowerCase()]=1);addEventListener('keyup',ev=>k[ev.key.toLowerCase()]=0);
cv.addEventListener('click',()=>{if(!sw){sw=1;ang=-.8;}});
function hit(){let tx=p.x+Math.cos(ang)*150,ty=p.y-30+Math.sin(ang)*150;if(tx>e.x&&tx<e.x+e.w&&ty>e.y&&ty<e.y+e.h&&e.hp>0){e.hp-=10;e.x+=20;e.f=4;try{cry.currentTime=0;cry.play()}catch{};for(let i=0;i<20;i++)parts.push({x:tx,y:ty,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:30})}}
function loop(){
if(k.w)p.y-=p.s;if(k.s)p.y+=p.s;if(k.a)p.x-=p.s;if(k.d)p.x+=p.s;
if(sw){ang+=.28;if(Math.abs(ang-0.32)<.15)hit();if(ang>1.5){sw=0;ang=-.8}}
ctx.clearRect(0,0,1000,600);ctx.fillStyle="#4a4";ctx.fillRect(0,540,1000,60);
ctx.fillStyle="#222";ctx.fillRect(p.x-15,p.y-60,30,60);
ctx.save();ctx.translate(p.x,p.y-30);ctx.rotate(ang);ctx.fillStyle="#bbb";ctx.fillRect(0,-4,150,8);ctx.fillStyle="#630";ctx.fillRect(-10,-8,12,16);ctx.restore();
if(e.hp>0){ctx.filter=e.f?"brightness(1.8)":"none";ctx.drawImage(img,e.x,e.y,e.w,e.h);ctx.filter="none";ctx.fillStyle="red";ctx.fillRect(e.x,e.y-18,e.w,8);ctx.fillStyle="lime";ctx.fillRect(e.x,e.y-18,e.w*(e.hp/100),8);if(e.f)e.f--;}else{ctx.save();ctx.translate(e.x+90,e.y+90);ctx.rotate(Math.PI/2);ctx.drawImage(img,-90,-90,180,180);ctx.restore();ctx.font="50px Arial";ctx.fillStyle="#fff";ctx.fillText("YOU WIN",360,80);}
parts=parts.filter(a=>a.l-->0);for(const a of parts){a.x+=a.vx;a.y+=a.vy;a.vy+=.25;ctx.fillStyle="red";ctx.beginPath();ctx.arc(a.x,a.y,3,0,7);ctx.fill();}
requestAnimationFrame(loop)}
img.onload=loop;
</script></body></html>
