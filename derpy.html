<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Hate This Guy</title>
<style>
body{
    margin:0;
    background:#1e1f22;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.container{
    position:relative;
    display:inline-block;
}

.container img{
    display:block;
    max-width:100%;
    height:auto;
}

.label{
    position:absolute;
    top:20px;
    left:-340px;
    color:#ff2a2a;
    font-size:54px;
    font-weight:900;
    white-space:nowrap;
    text-shadow:3px 3px 8px #000;
}

.arrow{
    position:absolute;
    top:55px;
    left:210px;
    width:210px;
    height:8px;
    background:#ff2a2a;
    transform:rotate(15deg);
    transform-origin:left center;
}

.arrow::after{
    content:"";
    position:absolute;
    right:-2px;
    top:-8px;
    border-left:22px solid #ff2a2a;
    border-top:12px solid transparent;
    border-bottom:12px solid transparent;
}
</style>
</head>
<body>

<div class="container">
    <!-- Replace with your screenshot filename -->
    <img src="discord-profile.png" alt="Discord Profile">

    <div class="label">
        I HATE THIS GUY
        <div class="arrow"></div>
    </div>
</div>

</body>
</html>
